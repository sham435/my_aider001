[project]
name = "antigravity-3.0"
version = "0.1.0"
description = "Local multi-agent coding OS — R1:8b edition"
dependencies = [
    "aider-chat>=0.75.0",
    "ollama>=0.4.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "black"]

[project.scripts]
ag3 = "src.orchestrator.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"