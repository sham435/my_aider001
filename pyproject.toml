[project]
name = "antigravity-3.0"
version = "0.1.0"
description = "Local multi-agent coding OS — R1:8b edition"
requires-python = ">=3.13"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
ag3 = "src.orchestrator.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]